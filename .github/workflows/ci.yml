name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated MCP demo dependencies
        run: npm --prefix examples/mcp-agent-demo ci --ignore-scripts --no-audit --no-fund

      - name: Verify real MCP protocol demo
        run: npm run test:mcp-demo

      - name: Lint
        run: npm run lint

      - name: Release hygiene
        run: npm run release:hygiene

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test

      - name: Reject whitespace errors
        run: git diff --check
