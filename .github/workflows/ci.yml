name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install hash-locked independent implementation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r implementations/python/requirements.lock

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated MCP demo dependencies
        run: npm --prefix examples/mcp-agent-demo ci --ignore-scripts --no-audit --no-fund

      - name: Verify real MCP protocol demo
        run: npm run test:mcp-demo

      - name: Lint
        run: npm run lint

      - name: Release hygiene
        run: npm run release:hygiene

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build and test
        env:
          CONTEXT_FUZZ_SEED: '12648430'
          CONTEXT_FUZZ_CASES: '256'
        run: npm test

      - name: Independent implementation and bidirectional conformance
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: npm run test:independent

      - name: Reject whitespace errors
        run: git diff --check
